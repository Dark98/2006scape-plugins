name: Update index.json

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'plugins/**'
      - '.github/scripts/update_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate index.json from metadata
        run: python3 .github/scripts/update_index.py

      - name: Commit and push index.json if changed
        run: |
          if git diff --quiet index.json; then
            echo "index.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: update index.json from plugin/script metadata"
          git push
